name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore sysmgr.sln

      - name: Build
        run: dotnet build sysmgr.sln -c Release --no-restore

      - name: Test
        run: dotnet test sysmgr.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish portable
        run: dotnet publish src/SysMgr.App/SysMgr.App.csproj -c Release -p:PublishProfile=Portable --no-build

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysmgr-portable
          path: src/SysMgr.App/bin/Portable/
          if-no-files-found: error
